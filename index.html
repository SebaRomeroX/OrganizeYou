<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1e222b">
  <title>OrganizeYou - To-Do List</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <h1>OrganizeYou</h1>
    <p class="subtitle">Your to-do list</p>

    <form id="task-form" class="task-form">
      <input
        type="text"
        id="task-input"
        class="task-input"
        placeholder="What needs to be done?"
        aria-label="New task"
        autocomplete="off"
        required
      >
      <button type="submit" class="add-btn">Add</button>
    </form>

    <section class="categories" aria-label="Categories">
      <h2>Categories</h2>
      <form id="category-form" class="category-form">
        <input
          type="text"
          id="category-input"
          class="category-input"
          placeholder="New category name"
          aria-label="New category name"
          autocomplete="off"
          required
        >
        <button type="submit" class="add-btn">Add</button>
      </form>
      <div id="category-list" class="category-list"></div>
      <p id="no-categories" class="hint">No categories yet. Create one above!</p>
    </section>

    <div id="task-list" class="task-list"></div>

    <p id="empty-state" class="empty-state">No tasks yet. Add one above!</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
